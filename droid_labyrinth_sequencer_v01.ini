[p10]

#### INPUTS
#I1, I5: seq1 clock, seq2 clock
#I2, I6: seq1 cont decay, seq2 cont decay
#I3, I7: seq1 corrupt, seq2 corrupt
#I4, I8: seq1 pitch range, seq2 pitch range

# You may want to disable ledgauge for pots where you apply external cv control, such as corrupt (I3, I7), for example.

#### OUTPUTS
#O1, O5: seq1 trig, seq2 trig
#O2, O6: seq1 cont, seq2 cont
#O3, O7: seq1 pitch, seq2 pitch
#O4, O8: seq1 pitch+cont, seq1 cont + seq2 cont

[midiin]
	start = _reset_in

### convert input clock trigger to a 10V signal to be used as 0/1 multiplyer
[gatetool]
	inputtrigger = I1
	outputtrigger = _c1
[gatetool]
	inputtrigger = I5
	outputtrigger = _c2
### select seq1 or seq1
[button]
	button = B1.5
	select = _sub_off
	led = _L15
	inverted = _show_s1
	output = _show_s2
[button]
	button = B1.7
	select = _sub_off
	states = 3 # output = 0,1,2
	led = _L17
	output = _select_seq
[compare]
	input = _select_seq
	compare = 1
	ifequal = 0
	else = 1
	output = _select_s1
[compare]
	input = _select_seq
	compare = 0
	ifequal = 0
	else = 1
	output = _select_s2
### presets
[lfo]
	hz = 2
	offset = -1
	triangle = _lfo_sub
[lfo]
	hz = 8
	square = _lfo
[button]
	button = B2.8
	output = _sub_on
	inverted = _sub_off
[copy]
	input = _sub_on * _lfo_sub
	output = L2.8
[buttongroup]
	select = _sub_on
	button1 = B1.5
	button2 = B1.6
	button3 = B1.7
	button4 = B1.8
	button5 = B2.5
	button6 = B2.6
	button7 = B2.7
	led1 = _sub_L15
	led2 = _sub_L16
	led3 = _sub_L17
	led4 = _sub_L18
	led5 = _sub_L25
	led6 = _sub_L26
	led7 = _sub_L27
	value1 = 0
	value2 = 1
	value3 = 2
	value4 = 3
	value5 = 4
	value6 = 5
	value7 = 6
	output = _preset
	buttonpress = _load
	longpress = _save
[copy] # add the _load signal to the _reset signal here, if you wish the loaded sequences start at their individual start bits whithout having to stop and restart the sequencers (which will send a _reset signal).
	input = _reset_in #+ _load
	output = _reset

[contour] # animation for saving presets
	trigger = _save
	attack = 0
	release = 0
	hold = 2
	output = _save_on
[copy]
	input = -2 * _sub_on + 1
	output = _amplitude
[copy]
	input = _lfo * _amplitude
	output = _lfo_scaled
[switch]
	input = _save_on * _lfo_scaled
	offset = _preset
	output1 = _save_blink0
	output2 = _save_blink6
	output3 = _save_blink5
	output4 = _save_blink4
	output5 = _save_blink3
	output6 = _save_blink2
	output7 = _save_blink1

